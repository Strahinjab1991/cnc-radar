name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licences and install platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then SDKM=$(ls "$ANDROID_HOME"/tools/bin/sdkmanager 2>/dev/null | head -1); fi
          echo "sdkmanager=$SDKM"
          if [ -n "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager nije nadjen, Gradle ce sam provjeriti SDK"
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Core tests (pure Java)
        run: |
          javac -d /tmp/rt app/src/main/java/com/cncmikron/radar/core/*.java core-test/com/cncmikron/radar/core/CoreTest.java
          java -cp /tmp/rt com.cncmikron.radar.core.CoreTest

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CNC-Radar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
